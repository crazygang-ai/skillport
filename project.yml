name: Skillport
options:
  bundleIdPrefix: ai.crazygang
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  Yams:
    url: https://github.com/jpsim/Yams
    from: "5.1.0"
  CodeEditor:
    url: https://github.com/ZeeZide/CodeEditor
    from: "1.2.0"
  swift-markdown:
    url: https://github.com/apple/swift-markdown
    from: "0.4.0"
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: "2.7.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Skillport:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - App
      - Domain
    resources:
      - App/Resources
    dependencies:
      - package: Sparkle
      - package: Yams
      - package: CodeEditor
      - package: swift-markdown
        product: Markdown
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.crazygang.Skillport
        PRODUCT_NAME: Skillport
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: App/Resources/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT"
        CODE_SIGN_ENTITLEMENTS: build/Skillport.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
  SkillportTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Tests/SkillportTests
    resources:
      - path: Tests/SkillportTests/TestSupport/Fixtures
        type: folder
    dependencies:
      - target: Skillport
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Skillport.app/Contents/MacOS/Skillport"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Skillport:
    build:
      targets:
        Skillport: all
        SkillportTests: [test]
    test:
      targets:
        - SkillportTests
    run:
      config: Debug
    archive:
      config: Release
