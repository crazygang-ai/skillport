name: Skillport
options:
  bundleIdPrefix: ai.crazygang
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  # 依赖在后续 task 中按需添加
targets:
  Skillport:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - App
      - Domain
    resources:
      - App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.crazygang.Skillport
        PRODUCT_NAME: Skillport
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: App/Resources/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT"
        CODE_SIGN_ENTITLEMENTS: build/Skillport.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
  SkillportTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Tests/SkillportTests
    dependencies:
      - target: Skillport
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Skillport.app/Contents/MacOS/Skillport"
schemes:
  Skillport:
    build:
      targets:
        Skillport: all
        SkillportTests: [test]
    test:
      targets:
        - SkillportTests
    run:
      config: Debug
    archive:
      config: Release
