name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Bootstrap
        run: ./Scripts/bootstrap.sh

      - name: Generate project
        run: ./Scripts/generate-project.sh

      - name: Check parser parity
        run: ./Scripts/check-parser-parity.sh

      - name: Lint
        run: swift-format lint --recursive App Domain Tests SkillportPreview

      - name: Test
        run: |
          set -o pipefail
          xcodebuild \
            -scheme Skillport \
            -destination 'platform=macOS,arch=arm64' \
            test

      - name: Build release app
        run: |
          xcodebuild \
            -scheme Skillport \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            build

      - name: Stage app
        run: |
          rm -rf build/export
          mkdir -p build/export
          ditto build/DerivedData/Build/Products/Release/Skillport.app build/export/Skillport.app

      - name: Package DMG
        run: ./Scripts/package-dmg.sh build/export/Skillport.app ${GITHUB_REF_NAME#v} build/export

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/export/Skillport-*.dmg
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          body: |
            This DMG is ad-hoc signed and not notarized. macOS may require opening it from System Settings > Privacy & Security on first launch.
